<style>

  --shadow:0 2px 10px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  padding-inline:16px; padding-block:0; min-height:100vh;
}
.wrap{max-width:460px; margin:0 auto; padding-block:20px 32px}
.eng{font-family:"Andika","Comic Sans MS",-apple-system,sans-serif}

/* ---------- 홈 ---------- */
.home-head{text-align:center; margin-bottom:6px}
.home-head .mascot{font-size:40px; line-height:1}
h1{font-size:22px; margin:8px 0 4px; text-wrap:balance}
.home-head p.sub{color:var(--sub); font-size:14px; margin:0 0 4px}
.howto{
  background:var(--accent-soft); border-radius:14px; padding:12px 14px;
  font-size:14px; line-height:1.6; margin:14px 0 18px;
}
.howto b{color:var(--accent)}
.total{
  display:flex; justify-content:space-between; align-items:baseline;
  font-size:14px; color:var(--sub); margin:0 2px 8px;
}
.total b{color:var(--ink); font-variant-numeric:tabular-nums}
.decks{display:flex; flex-direction:column; gap:12px}
.deck{
  width:100%; text-align:left; background:var(--card); border:1px solid var(--line);
  border-radius:16px; padding:14px 16px; cursor:pointer; color:var(--ink);
  font:inherit; box-shadow:var(--shadow);
}
.deck:active{transform:scale(.985)}
.deck .row1{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
.deck .name{font-weight:700; font-size:16px}
.deck .lesson{font-size:12px; color:var(--accent); font-weight:700; letter-spacing:.04em}
.deck .row2{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:8px}
.deck .left{font-size:13px; color:var(--sub); font-variant-numeric:tabular-nums}
.deck .done-badge{font-size:13px; color:var(--green); font-weight:700}
.bar{flex:1; height:8px; border-radius:4px; background:var(--line); overflow:hidden}
.bar i{display:block; height:100%; background:var(--green); border-radius:4px}
.reset-line{margin-top:10px; text-align:right}
.reset-btn{
  background:none; border:none; color:var(--sub); font-size:12px;
  text-decoration:underline; cursor:pointer; padding:4px;
}

/* ---------- 학습 ---------- */
.top{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:14px}
.back{
  background:var(--card); border:1px solid var(--line); border-radius:10px;
  padding:8px 12px; font-size:14px; color:var(--ink); cursor:pointer; font:inherit;
}
.counter{font-size:13px; color:var(--sub); font-variant-numeric:tabular-nums; text-align:right}
.counter b{color:var(--ink)}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:22px;
  box-shadow:var(--shadow); padding:28px 20px 22px; text-align:center;
}
.deck-tag{font-size:12px; color:var(--accent); font-weight:700; letter-spacing:.04em; margin-bottom:14px}
.word{
  font-size:clamp(30px,11vw,46px); font-weight:700; line-height:1.15;
  margin:0 0 6px; word-break:keep-all; text-wrap:balance;
}
.word.long{font-size:clamp(22px,7.5vw,32px)}
.pron{font-size:17px; color:var(--sub); margin:0 0 16px}
.mean{
  font-size:21px; font-weight:700; line-height:1.4; margin:0 auto 18px;
  padding:12px 14px; background:var(--accent-soft); border-radius:12px;
  max-width:34ch; word-break:keep-all;
}
.listen{display:flex; justify-content:center; gap:10px; margin-bottom:12px}
.listen button{
  font:inherit; font-size:15px; padding:10px 16px; border-radius:999px;
  border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer;
}
.listen button:active{transform:scale(.96)}
.hint{font-size:14px; color:var(--sub); margin:0}
.sound-help{margin-top:12px; font-size:13px; color:var(--sub); text-align:left}
.sound-help summary{cursor:pointer; text-align:center; list-style:none}
.sound-help summary::-webkit-details-marker{display:none}
.sound-help ol{margin:8px 0 0; padding-left:20px; line-height:1.7}
.sound-help b{color:var(--ink)}
.answers{display:flex; gap:12px; margin-top:16px}
.answers button{
  flex:1; font:inherit; font-size:18px; font-weight:700; padding:16px 8px;
  border-radius:16px; border:none; cursor:pointer; color:#fff;
}
.answers .no{background:var(--coral)}
.answers .yes{background:var(--green)}
.answers button:active{transform:scale(.97)}
.answers .label-sub{display:block; font-size:12px; font-weight:400; margin-top:3px; opacity:.9}

/* ---------- 판 끝 / 완료 ---------- */
.result{
  background:var(--card); border:1px solid var(--line); border-radius:22px;
  box-shadow:var(--shadow); padding:32px 20px; text-align:center;

.result .big{font-size:48px; line-height:1; margin-bottom:12px}

.result p b{color:var(--ink)}
.result .stars{font-size:26px; letter-spacing:4px; margin-bottom:14px; color:var(--star)}
.btn-col{display:flex; flex-direction:column; gap:10px}
.btn-main{

function loadKnown(id){ try{ return new Set(JSON.parse(localStorage.getItem("voca78."+id)||"[]")); }catch(e){ return new Set(); } }
function saveKnown(id,set){ try{ localStorage.setItem("voca78."+id, JSON.stringify([...set])); }catch(e){} }
function clearKnown(id){ try{ localStorage.removeItem("voca78."+id); }catch(e){} }

// ---------- 소리 ----------
let voicePick=null;
function pickVoice(){
  const vs=(speechSynthesis.getVoices()||[]).filter(v=>v.lang&&v.lang.toLowerCase().startsWith("en"));
  voicePick = vs.find(v=>/samantha|aria|jenny|google us english/i.test(v.name))
           || vs.find(v=>v.lang==="en-US") || vs[0] || null;
}
if("speechSynthesis" in window){
  pickVoice();
  speechSynthesis.onvoiceschanged=pickVoice;
}
function speak(text,rate){
  if(!("speechSynthesis" in window)) return;
  try{
    if(speechSynthesis.speaking||speechSynthesis.pending) speechSynthesis.cancel();
    speechSynthesis.resume();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="en-US"; u.rate=rate;
    if(voicePick) u.voice=voicePick;
    speechSynthesis.speak(u);
  }catch(e){}
}

function slug(w){ return w.toLowerCase().replace(/[^a-z]+/g,"-").replace(/^-+|-+$/g,""); }
let audioEl=null;
function playWord(text,slow){
  let fired=false;
  const fallback=()=>{ if(fired) return; fired=true; speak(text,slow?0.5:0.8); };

    if(!audioEl) audioEl=new Audio();
    audioEl.onerror=fallback;
    audioEl.pause();
    audioEl.src="audio/"+slug(text)+".m4a";
    audioEl.playbackRate=slow?0.6:1;
    try{ audioEl.preservesPitch=true; }catch(e){}
    const p=audioEl.play();
    if(p&&p.catch) p.catch(fallback);
  }catch(e){ fallback(); }
}
// 핸드폰 브라우저는 손가락이 화면에 닿은 순간에만 소리를 허락한다.
// 첫 터치 때 무음 한 마디를 재생해 소리 통로를 미리 열어 둔다.
let audioUnlocked=false;
function unlockAudio(){
  if(audioUnlocked||!("speechSynthesis" in window)) return;
  try{
    const u=new SpeechSynthesisUtterance(" ");
    u.volume=0; u.lang="en-US";
    speechSynthesis.speak(u);
    audioUnlocked=true;
  }catch(e){}
}
document.addEventListener("pointerdown",unlockAudio,{capture:true});
document.addEventListener("touchstart",unlockAudio,{capture:true,passive:true});

// ---------- 화면 ----------
const $=id=>document.getElementById(id);
const screens={home:$("home"),study:$("study"),result:$("result")};
function show(name){ for(const k in screens) screens[k].hidden=(k!==name); window.scrollTo(0,0); }

// 홈 그리기
function renderHome(){
  let totalKnown=0;
  const list=$("deckList"); list.innerHTML="";
  DECKS.forEach(d=>{
    const known=loadKnown(d.id);
    totalKnown+=known.size;
    const left=d.words.length-known.size;
    const pct=Math.round(known.size/d.words.length*100);
    const b=document.createElement("button");
    b.className="deck";
    b.innerHTML=
      '<div class="row1"><span class="name">'+d.name+'</span><span class="lesson">'+d.lesson+'</span></div>'+
      '<div class="row2">'+
        (left===0
          ? '<span class="done-badge">🎉 다 외웠어요!</span>'
          : '<span class="left">남은 단어 <b>'+left+'</b>개 / '+d.words.length+'개</span>')+
        '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
      '</div>';
    b.addEventListener("click",()=>startDeck(d));
    list.appendChild(b);
  });
  $("totalKnown").textContent=totalKnown;
}

// ---------- 학습 진행 ----------
let cur=null; // {deck, queue, idx, missed, roundTotal, known}
function startDeck(deck){
  const known=loadKnown(deck.id);
  const queue=deck.words.filter(w=>!known.has(w[0]));
  if(queue.length===0){ showDone(deck); return; }
  cur={deck,queue,idx:0,missed:[],roundTotal:queue.length,known};
  show("study");
  renderCard();
}
function renderCard(){
  const w=cur.queue[cur.idx];
  $("deckTag").textContent=cur.deck.lesson+" · "+cur.deck.name;
  const wordEl=$("word");
  wordEl.textContent=w[0];
  wordEl.classList.toggle("long",w[0].length>10);
  $("pron").textContent="["+w[1]+"]";
  $("mean").textContent=w[2];
  $("studyCounter").innerHTML="이번 판 <b>"+(cur.idx+1)+"</b> / "+cur.roundTotal+"개";
  setTimeout(()=>playWord(w[0],false),300);
}
$("againBtn").addEventListener("click",()=>playWord(cur.queue[cur.idx][0],false));
$("slowBtn").addEventListener("click",()=>playWord(cur.queue[cur.idx][0],true));
$("yesBtn").addEventListener("click",()=>{
  const w=cur.queue[cur.idx];
  cur.known.add(w[0]); saveKnown(cur.deck.id,cur.known);
  next();
});
$("noBtn").addEventListener("click",()=>{
  cur.missed.push(cur.queue[cur.idx]);
  next();
});
function stopSound(){
  try{ if(audioEl) audioEl.pause(); }catch(e){}
  if("speechSynthesis" in window){ try{speechSynthesis.cancel();}catch(e){} }
}
function next(){
  stopSound();
  cur.idx++;
  if(cur.idx<cur.queue.length){ renderCard(); return; }
  // 한 판 끝
  if(cur.missed.length===0){ showDone(cur.deck); }
  else{ showRoundEnd(); }
}
function showRoundEnd(){
  const got=cur.roundTotal-cur.missed.length;
  const stars = got===cur.roundTotal?"★★★": got>=cur.roundTotal*0.6?"★★☆": got>0?"★☆☆":"☆☆☆";
  $("resultEmoji").textContent="💪";
  $("resultStars").textContent=stars;
  $("resultTitle").textContent="잘했어요!";
  $("resultText").innerHTML="이번 판 "+cur.roundTotal+"개 중 <b>"+got+"개</b>를 알았어요.<br>남은 <b>"+cur.missed.length+"개</b>만 다시 볼까요?";
  const btns=$("resultBtns"); btns.innerHTML="";
  const go=document.createElement("button");
  go.className="btn-main"; go.textContent="남은 "+cur.missed.length+"개 다시 보기";
  go.addEventListener("click",()=>{
    cur.queue=cur.missed; cur.missed=[]; cur.idx=0; cur.roundTotal=cur.queue.length;
    show("study"); renderCard();
  });
  const home=document.createElement("button");
  home.className="btn-quiet"; home.textContent="오늘은 여기까지 (처음 화면)";
  home.addEventListener("click",goHome);
  btns.append(go,home);
  show("result");
}
function showDone(deck){
  $("resultEmoji").textContent="🎉";
  $("resultStars").textContent="★★★";
  $("resultTitle").textContent="「"+deck.name+"」을 전부 외웠어요!";
  $("resultText").innerHTML=deck.lesson+" 단어 <b>"+deck.words.length+"개</b>를 모두 「알아요」 했어요.<br>정말 대단해요! 다른 묶음도 해 볼까요?";
  const btns=$("resultBtns"); btns.innerHTML="";
  const home=document.createElement("button");
  home.className="btn-main"; home.textContent="처음 화면으로";
  home.addEventListener("click",goHome);
  const redo=document.createElement("button");
  redo.className="btn-quiet"; redo.textContent="이 묶음 처음부터 다시 외우기";
  redo.addEventListener("click",()=>{ clearKnown(deck.id); startDeck(deck); });
  btns.append(home,redo);
  show("result");
}
function goHome(){
  stopSound();
  renderHome(); show("home");
}
$("backBtn").addEventListener("click",goHome);
$("resetAll").addEventListener("click",()=>{
  if(confirm("지금까지 「알아요」 한 기록을 전부 지우고 처음부터 할까요?")){
    DECKS.forEach(d=>clearKnown(d.id));
    renderHome();
  }
});

renderHome();
show("home");
</script>
